[project]
name = "fcma"
version = "1.0.0"
description = "Fast Container to Machine Allocator"
authors = [{ name = "Jose Maria Lopez", email = "chechu@uniovi.es" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cloudmodel @ git+https://github.com/jldiaz-uniovi/cloudmodel.git",
    "numpy",
    "pint",
    "pulp>=2.8.0,<3.0.0",
    "rich>=13.7.0,<14.0.0",
]

[dependency-groups]
dev = [
    "black>=24.2.0",
    "coverage>=7.4.3",
    "mypy>=1.9.0",
    "pylint>=3.1.0",
    "pytest>=8.1.1",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fcma", "fcma.*"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "smoke: simple test that check that nothing blows up",
]
